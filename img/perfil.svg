<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="50%" stop-color="#0b5ed7"/>
      <stop offset="100%" stop-color="#084298"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20c997"/>
      <stop offset="100%" stop-color="#0dcaf0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarGrad)" />
  <circle cx="200" cy="200" r="184" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="10 6" opacity="0.6"/>

  <!-- Developer Silhouette / Avatar -->
  <!-- Shoulders / Torso -->
  <path d="M 90 350 C 90 270, 150 240, 200 240 C 250 240, 310 270, 310 350 Z" fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>
  <!-- Neck -->
  <rect x="175" y="195" width="50" height="45" rx="10" fill="#f1f5f9"/>
  <!-- Head -->
  <ellipse cx="200" cy="150" rx="55" ry="65" fill="#f8fafc" filter="url(#shadow)"/>
  
  <!-- Hair -->
  <path d="M 140 145 C 135 110, 160 80, 200 80 C 240 80, 265 110, 260 145 C 245 125, 230 115, 200 115 C 170 115, 155 125, 140 145 Z" fill="#1e293b"/>
  
  <!-- Modern Glasses -->
  <rect x="160" y="138" width="32" height="22" rx="6" fill="none" stroke="#0d6efd" stroke-width="4"/>
  <rect x="208" y="138" width="32" height="22" rx="6" fill="none" stroke="#0d6efd" stroke-width="4"/>
  <line x1="192" y1="149" x2="208" y2="149" stroke="#0d6efd" stroke-width="4"/>
  
  <!-- Smile -->
  <path d="M 185 185 Q 200 198 215 185" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Code Badge Floating Bottom Right -->
  <g transform="translate(250, 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="105" height="46" rx="23" fill="#0f172a"/>
    <rect x="2" y="2" width="101" height="42" rx="21" fill="none" stroke="#20c997" stroke-width="2"/>
    <text x="52" y="28" fill="#20c997" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="16" text-anchor="middle">&lt;/DAW&gt;</text>
  </g>
</svg>
