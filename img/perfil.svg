<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background Circle (Neutro / Gris suave) -->
  <circle cx="200" cy="200" r="190" fill="#6c757d" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="#adb5bd" stroke-width="2" />

  <!-- Developer Silhouette / Avatar -->
  <!-- Torso -->
  <path d="M 90 350 C 90 270, 150 240, 200 240 C 250 240, 310 270, 310 350 Z" fill="#ffffff" />
  <!-- Neck -->
  <rect x="175" y="195" width="50" height="45" rx="6" fill="#dee2e6"/>
  <!-- Head -->
  <ellipse cx="200" cy="150" rx="55" ry="65" fill="#f8f9fa" />
  
  <!-- Hair -->
  <path d="M 140 145 C 135 110, 160 80, 200 80 C 240 80, 265 110, 260 145 C 245 125, 230 115, 200 115 C 170 115, 155 125, 140 145 Z" fill="#343a40"/>
  
  <!-- Glasses -->
  <rect x="160" y="138" width="32" height="22" rx="4" fill="none" stroke="#212529" stroke-width="3"/>
  <rect x="208" y="138" width="32" height="22" rx="4" fill="none" stroke="#212529" stroke-width="3"/>
  <line x1="192" y1="149" x2="208" y2="149" stroke="#212529" stroke-width="3"/>
  
  <!-- Smile -->
  <path d="M 185 185 Q 200 196 215 185" fill="none" stroke="#6c757d" stroke-width="2.5" stroke-linecap="round"/>
</svg>
