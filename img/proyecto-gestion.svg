<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="navGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="12" fill="#0f172a"/>

  <!-- Browser Window Header -->
  <path d="M 0 12 Q 0 0 12 0 L 588 0 Q 600 0 600 12 L 600 44 L 0 44 Z" fill="#1e293b"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>
  <rect x="90" y="10" width="340" height="24" rx="6" fill="#0f172a"/>
  <text x="105" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://gestion-app.local/dashboard (PHP + MySQL)</text>

  <!-- Top App Bar -->
  <rect x="0" y="44" width="600" height="40" fill="url(#navGrad3)"/>
  <text x="20" y="69" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">AdminPanel · Gestión de Usuarios &amp; Almacén</text>
  <rect x="490" y="52" width="90" height="24" rx="4" fill="#ffffff" opacity="0.2"/>
  <text x="510" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">Marco G. ▾</text>

  <!-- KPI Metrics Row -->
  <g transform="translate(20, 100)">
    <!-- KPI 1 -->
    <rect width="170" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Clientes</text>
    <text x="15" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="20">1,248</text>
    <text x="120" y="50" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11">+12%</text>

    <!-- KPI 2 -->
    <g transform="translate(195, 0)">
      <rect width="170" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Ventas del Mes</text>
      <text x="15" y="50" fill="#2dd4bf" font-family="system-ui, sans-serif" font-weight="bold" font-size="20">14.850 €</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(390, 0)">
      <rect width="170" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Estado Base Datos</text>
      <text x="15" y="50" fill="#a78bfa" font-family="system-ui, sans-serif" font-weight="bold" font-size="18">MySQL Activa</text>
    </g>
  </g>

  <!-- Table Container -->
  <rect x="20" y="180" width="560" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="20" y="180" width="560" height="35" rx="8" fill="#273549"/>
  <text x="35" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">ID</text>
  <text x="80" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">USUARIO / CLIENTE</text>
  <text x="240" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">ROL</text>
  <text x="330" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">ESTADO</text>
  <text x="450" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">ACCIONES</text>

  <!-- Table Row 1 -->
  <line x1="20" y1="250" x2="580" y2="250" stroke="#334155" stroke-width="1"/>
  <text x="35" y="235" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11">#01</text>
  <text x="80" y="235" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Carlos Mendoza</text>
  <text x="240" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Administrador</text>
  <rect x="330" y="222" width="55" height="18" rx="4" fill="#065f46"/>
  <text x="340" y="235" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9">Activo</text>
  <rect x="450" y="222" width="45" height="18" rx="4" fill="#2563eb"/>
  <text x="460" y="235" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9">Editar</text>

  <!-- Table Row 2 -->
  <line x1="20" y1="290" x2="580" y2="290" stroke="#334155" stroke-width="1"/>
  <text x="35" y="275" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11">#02</text>
  <text x="80" y="275" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Laura Fernández</text>
  <text x="240" y="275" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Editor</text>
  <rect x="330" y="262" width="55" height="18" rx="4" fill="#065f46"/>
  <text x="340" y="275" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9">Activo</text>
  <rect x="450" y="262" width="45" height="18" rx="4" fill="#2563eb"/>
  <text x="460" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9">Editar</text>

  <!-- Table Row 3 -->
  <text x="35" y="315" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11">#03</text>
  <text x="80" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">David Morales</text>
  <text x="240" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cliente</text>
  <rect x="330" y="302" width="60" height="18" rx="4" fill="#854d0e"/>
  <text x="338" y="315" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9">Pendiente</text>
  <rect x="450" y="302" width="45" height="18" rx="4" fill="#2563eb"/>
  <text x="460" y="315" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9">Editar</text>
</svg>
