<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7952b3"/>
      <stop offset="100%" stop-color="#4c2889"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="12" fill="#1e1e2f"/>

  <!-- Browser Window Header -->
  <path d="M 0 12 Q 0 0 12 0 L 588 0 Q 600 0 600 12 L 600 44 L 0 44 Z" fill="#2d2d3f"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>

  <!-- URL Bar -->
  <rect x="90" y="10" width="380" height="24" rx="6" fill="#1e1e2f"/>
  <text x="105" y="26" fill="#adb5bd" font-family="system-ui, -apple-system, sans-serif" font-size="11">https://codelab-academia.dev/bootstrap5</text>

  <!-- Navbar inside page -->
  <rect x="20" y="60" width="560" height="40" rx="6" fill="url(#bgGrad1)"/>
  <text x="40" y="85" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">Bootstrap 5 · Codelab</text>
  <rect x="440" y="70" width="60" height="20" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="510" y="70" width="55" height="20" rx="4" fill="#ffc107"/>
  <text x="522" y="84" fill="#000" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="10">Acceder</text>

  <!-- Hero Banner inside page -->
  <rect x="20" y="112" width="560" height="85" rx="8" fill="#2b2d42"/>
  <text x="40" y="145" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="17">Aprende Maquetación Moderna</text>
  <text x="40" y="168" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Sistema Grid, utilidades Flexbox y diseño 100% responsivo.</text>

  <!-- 3 Responsive Cards inside page -->
  <!-- Card 1 -->
  <g transform="translate(20, 210)">
    <rect width="175" height="150" rx="8" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="12" y="12" width="151" height="50" rx="4" fill="#7952b3" opacity="0.15"/>
    <text x="20" y="42" fill="#7952b3" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">&lt;Grid /&gt;</text>
    <text x="12" y="80" fill="#1e293b" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">Breakpoints</text>
    <text x="12" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">sm, md, lg, xl y fluid.</text>
    <rect x="12" y="120" width="65" height="18" rx="4" fill="#0d6efd"/>
    <text x="24" y="133" fill="#fff" font-family="system-ui, sans-serif" font-size="9">Ver más</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(212, 210)">
    <rect width="175" height="150" rx="8" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="12" y="12" width="151" height="50" rx="4" fill="#0d6efd" opacity="0.15"/>
    <text x="20" y="42" fill="#0d6efd" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">&lt;Flexbox /&gt;</text>
    <text x="12" y="80" fill="#1e293b" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">Componentes</text>
    <text x="12" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Cards, Navbars, Modals.</text>
    <rect x="12" y="120" width="65" height="18" rx="4" fill="#0d6efd"/>
    <text x="24" y="133" fill="#fff" font-family="system-ui, sans-serif" font-size="9">Ver más</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(405, 210)">
    <rect width="175" height="150" rx="8" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="12" y="12" width="151" height="50" rx="4" fill="#20c997" opacity="0.15"/>
    <text x="20" y="42" fill="#20c997" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">&lt;Forms /&gt;</text>
    <text x="12" y="80" fill="#1e293b" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">Validación</text>
    <text x="12" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">HTML5 + Bootstrap JS.</text>
    <rect x="12" y="120" width="65" height="18" rx="4" fill="#0d6efd"/>
    <text x="24" y="133" fill="#fff" font-family="system-ui, sans-serif" font-size="9">Ver más</text>
  </g>
</svg>
